<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Unsubscribe — The Secretary Status</title><link rel="icon" href="/assets/images/favicon.png"><link rel="stylesheet" href="/assets/style.css?v=4.0.0"></head><body><div data-site-header></div><main class="container page"><section class="not-found-panel" data-unsubscribe><span class="eyebrow">Status notifications</span><h1>Updating your subscription…</h1></section></main><div data-site-footer></div><script type="module">import{statusApi}from'/assets/api.js';import{esc,mountLayout}from'/assets/layout.js';await mountLayout('');const root=document.querySelector('[data-unsubscribe]');try{const token=new URLSearchParams(location.search).get('token');if(!token)throw new Error('This unsubscribe link is incomplete.');await statusApi('unsubscribe',{token});root.innerHTML='<span class="eyebrow">Status notifications</span><h1>You are unsubscribed.</h1><p>No further status emails will be sent to this address.</p><a class="button primary" href="/">Return home</a>';}catch(error){root.innerHTML=`<h1>Unable to unsubscribe</h1><p>${esc(error.message)}</p>`;}</script></body></html>
